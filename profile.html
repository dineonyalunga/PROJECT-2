<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <div class="navbar-box d-flex justify-content-center gap-4">

        <a href="#" class="nav-link">Overview</a>
        <a href="#" class="nav-link">Appointments</a>
        <a href="#" class="nav-link">Records</a>
        <a href="#" class="nav-link">Medications</a>
        <a href="#" class="nav-link">Consultation</a>
        <a href="#" class="nav-link">Profile</a>

    </div>

    <div class="row mt-4">

        <div class="col-md-5">

            <div class="card-box">

                <h4>Personal Information</h4>

                <div class="profile-circle mt-4 mb-4">
                    JD
                </div>

                <div class="row">

                    <div class="col-md-6">
                        <label>First Name</label>
                        <input type="text" class="form-control" value="John">
                    </div>

                    <div class="col-md-6">
                        <label>Last Name</label>
                        <input type="text" class="form-control" value="Doe">
                    </div>

                </div>

                <div class="mt-3">
                    <label>ID Number</label>
                    <input type="text" class="form-control" value="1234567890">
                </div>

                <div class="row mt-3">

                    <div class="col-md-6">
                        <label>Date of Birth</label>
                        <input type="date" class="form-control">
                    </div>

                    <div class="col-md-6">
                        <label>Gender</label>

                        <select class="form-select">
                            <option>Male</option>
                            <option>Female</option>
                        </select>

                    </div>

                </div>

                <div class="mt-3">
                    <label>Phone Number</label>
                    <input type="text" class="form-control" value="+1 (555) 123-4567">
                </div>

                <div class="mt-3">
                    <label>Email</label>
                    <input type="email" class="form-control" value="john.doe@example.com">
                </div>

                <button class="btn-dark-custom mt-4">
                    Update Profile
                </button>

            </div>

        </div>

        <div class="col-md-7">

            <div class="card-box">

                <h4>Medical Information</h4>

                <div class="mt-3">

                    <label>Blood Type</label>

                    <select class="form-select">

                        <option>A+</option>
                        <option>B+</option>
                        <option>O+</option>

                    </select>

                </div>

                <div class="mt-3">

                    <label>Allergies</label>

                    <textarea class="form-control"
                              rows="3">Penicillin, Tree pollen</textarea>

                </div>

                <div class="mt-3">

                    <label>Chronic Conditions</label>

                    <textarea class="form-control"
                              rows="3">Type 2 Diabetes, Hypertension</textarea>

                </div>

                <div class="mt-3">

                    <label>Emergency Contact Name</label>

                    <input type="text"
                           class="form-control"
                           value="Jane Doe">

                </div>

                <div class="mt-3">

                    <label>Emergency Contact Phone</label>

                    <input type="text"
                           class="form-control"
                           value="+1 (555) 987-6543">

                </div>

                <button class="btn-dark-custom mt-4">
                    Update Medical Info
                </button>

            </div>

        </div>

    </div>

</div>

</body>
</html>
